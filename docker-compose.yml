version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: resqcore-postgres
    environment:
      - POSTGRES_USER=resqcore
      - POSTGRES_PASSWORD=resqcore_dev_password
      - POSTGRES_DB=resqcore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqcore -d resqcore"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resqcore-backend
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://resqcore:resqcore_dev_password@postgres:5432/resqcore

  command-center:
    build:
      context: ./resqcore
      dockerfile: Dockerfile
    container_name: resqcore-command-center
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
